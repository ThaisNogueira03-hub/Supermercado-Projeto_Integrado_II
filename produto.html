<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Produto | Supermercado Anhanvera
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >




  <script
    src="js/produto.js"
    defer
  ></script>




  <script
    src="js/home.js"
    defer
  ></script>



  <script
    src="js/inatividade.js"
    defer
  ></script>



  <script
    src="js/acessibilidade.js"
    defer
  ></script>



  <script
    src="js/assistente-voz.js"
    defer
  ></script>

</head>


<body class="pagina-interna-totem">




  <header class="cabecalho">

    <div class="cabecalho-conteudo">



      <a
        href="index.html"
        class="marca-anhanvera"
        style="text-decoration: none;"
      >

        <svg
          class="marca-carrinho"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <circle
            cx="9"
            cy="20"
            r="1"
          ></circle>

          <circle
            cx="19"
            cy="20"
            r="1"
          ></circle>

          <path
            d="M3 4h2l2.6 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"
          ></path>

        </svg>


        <div class="marca-texto">

          <span>
            Supermercado
          </span>

          <strong>
            Anhanvera
          </strong>

          <i></i>

        </div>

      </a>


      <div class="cabecalho-utilidades">



        <div class="info-tempo info-data">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2"
            ></rect>

            <line
              x1="16"
              y1="3"
              x2="16"
              y2="7"
            ></line>

            <line
              x1="8"
              y1="3"
              x2="8"
              y2="7"
            ></line>

            <line
              x1="3"
              y1="11"
              x2="21"
              y2="11"
            ></line>

          </svg>


          <span id="dataAtual">
            Carregando...
          </span>

        </div>


  

        <span
          class="divisor-topo"
          aria-hidden="true"
        ></span>




        <div class="info-tempo">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="9"
            ></circle>

            <path
              d="M12 7v5l3 2"
            ></path>

          </svg>


          <strong id="horaAtual">
            --:--
          </strong>

        </div>




        <span
          class="divisor-topo"
          aria-hidden="true"
        ></span>




        <div
          class="acessibilidade-slot"
          aria-label="Recursos de acessibilidade"
        ></div>

      </div>

    </div>

  </header>




  <main>




    <a
      href="index.html"
      class="voltar"
    >
      ← Voltar para pesquisa
    </a>


    <section
      id="detalhesProduto"
      class="detalhes-produto"
    >

      <div class="mensagem">
        Carregando produto...
      </div>

    </section>

  </main>


  <footer>

    Supermercado Anhanvera

  </footer>


</body>

</html>
